<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="MarketDesk demo store: browse products, check out, and track orders.">
    <link rel="stylesheet" href="styles.css?v=2" />
    <link rel="icon" href="favicon.ico" />
    <title>MarketDesk | Store & Orders</title>
</head>

<body>

    <header class="header">
        <div class="brand">
            <span class="brand-mark">M</span>
            <div>
                <h1>MarketDesk</h1>
                <p class="tagline">Demo store & order tracker</p>
            </div>
        </div>
        <nav class="tabs" aria-label="Sections">
            <button type="button" class="tab active" data-tab="shop">Shop</button>
            <button type="button" class="tab" data-tab="orders">Orders</button>
        </nav>
    </header>

    <main class="container">
        <!-- TAB: Shop -->
        <section id="tab-shop" class="tab-panel active">
            <div class="grid">
                <section class="card">
                    <div class="card-head">
                        <h2>Products</h2>
                        <button id="btnReloadProducts" class="btn ghost">Reload</button>
                    </div>

                    <div class="filters">
                        <input id="searchName" type="search" placeholder="Search by name..." aria-label="Search products by name" />
                        <select id="filterCategory" aria-label="Filter by category">
                            <option value="">All categories</option>
                        </select>

                        <label class="toggle">
                            <input id="onlyActive" type="checkbox" checked />
                            <span>Active only</span>
                        </label>
                    </div>

                    <div id="productsList" class="list"></div>
                </section>

                <aside class="card cart">
                    <div class="card-head">
                        <h2>Cart</h2>
                        <span id="cartCount" class="pill">0 items</span>
                    </div>
                    <div id="cartList" class="list"></div>

                    <div class="totals">
                        <div><span>Total:</span> <strong id="cartTotal">$0.00</strong></div>
                    </div>

                    <div class="checkout">
                        <h3>Checkout</h3>

                        <label class="field">
                            <span>Customer ID</span>
                            <input id="customerId" type="number" min="1" value="1" />
                        </label>

                        <button id="btnCheckout" class="btn primary">Place order</button>

                        <p id="checkoutMsg" class="msg" aria-live="polite"></p>
                    </div>
                </aside>
            </div>
        </section>

        <!-- TAB: Orders -->
        <section id="tab-orders" class="tab-panel">
            <div class="grid">
                <section class="card">
                    <div class="card-head">
                        <h2>Recent orders</h2>
                        <button id="btnReloadOrders" class="btn ghost">Reload</button>
                    </div>
                    <div id="ordersList" class="list"></div>
                </section>

                <section class="card">
                    <h2>Order detail</h2>
                    <div id="orderDetail" class="detail">
                        <p class="muted">Select an order to see the details.</p>
                    </div>
                </section>
            </div>
        </section>
    </main>

    <footer class="footer">
        <span>MarketDesk demo • Spring Boot + SQLite • Prices in BRL</span>
    </footer>

    <script src="app.js?v=2"></script>

</body>
</html>
